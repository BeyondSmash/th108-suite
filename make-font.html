<!doctype html><meta charset="utf-8"><title>th108-font generator</title>
<!-- One-time generator for th108-daemon/th108-font.js: rasterizes printable ASCII 32-126
     (bold 13px Segoe UI) into 9x14 packed bit rows via canvas. Open via the local server,
     copy the textarea into th108-daemon/th108-font.js. Committed so the font can be regenerated. -->
<textarea id="out" style="width:100%;height:90vh"></textarea>
<script>
// PROPORTIONAL glyphs (2026-06-12): fixed 9px cells clipped wide glyphs ('M') and left gaps
// after narrow ones ('i') on the LCD. Each glyph stores its own advance: [adv, row0..row13].
const CW = 16, CH = 14, c = document.createElement('canvas');
c.width = CW; c.height = CH; const g = c.getContext('2d', { willReadFrequently: true });
const rows = [];
for (let ch = 32; ch <= 126; ch++) {
  const s = String.fromCharCode(ch);
  g.clearRect(0, 0, CW, CH); g.font = 'bold 13px "Segoe UI"'; g.textBaseline = 'top';
  g.fillStyle = '#fff'; g.fillText(s, 0, 0);
  const adv = Math.max(3, Math.min(CW, Math.ceil(g.measureText(s).width)));
  const d = g.getImageData(0, 0, CW, CH).data, bits = [];
  for (let y = 0; y < CH; y++) { let v = 0; for (let x = 0; x < CW; x++) if (d[(y * CW + x) * 4 + 3] > 96) v |= (1 << x); bits.push(v); }
  rows.push('[' + adv + ',' + bits.join(',') + ']');
}
document.getElementById('out').value =
  '// th108-font.js - GENERATED by make-font.html (proportional, max ' + CW + 'x' + CH + ', ASCII 32-126, bold 13px Segoe UI).\n' +
  '// Each glyph = [advance, row0..row' + (CH - 1) + ']. Pure data + a pixel blitter: no canvas in the daemon.\n' +
  'const CW = ' + CW + ', CH = ' + CH + ';\nconst GLYPHS = [\n' + rows.join(',\n') + '\n];\n' +
`
function glyph(ch) { const i = ch.charCodeAt(0) - 32; return (i >= 0 && i < GLYPHS.length) ? GLYPHS[i] : null; }
function charWidth(ch, scale) { const gl = glyph(ch); return gl ? (gl[0] + 1) * scale : 0; }   // +1px letter spacing
function textWidth(text, scale) { let w = 0; for (const ch of String(text)) w += charWidth(ch, scale); return w; }
// truncate to maxW px, appending '..' when cut
function fitText(text, maxW, scale) {
  text = String(text || '');
  if (textWidth(text, scale) <= maxW) return text;
  const dots = textWidth('..', scale);
  let out = '', w = 0;
  for (const ch of text) { const a = charWidth(ch, scale); if (w + a > maxW - dots) break; out += ch; w += a; }
  return out + '..';
}
// buf = RGBA Uint8ClampedArray, w = row width in px. Returns the x after the last glyph.
function drawText(buf, w, x, y, text, scale, rgb) {
  let cx = x;
  for (const ch of String(text)) {
    const gl = glyph(ch);
    if (!gl) continue;
    for (let gy = 0; gy < CH; gy++) {
      const row = gl[1 + gy];
      if (!row) continue;
      for (let gx = 0; gx < CW; gx++) {
        if (!(row & (1 << gx))) continue;
        for (let sy = 0; sy < scale; sy++) for (let sx = 0; sx < scale; sx++) {
          const px = cx + gx * scale + sx, py = y + gy * scale + sy;
          if (px < 0 || py < 0 || px >= w) continue;
          const o = (py * w + px) * 4;
          if (o + 3 < buf.length) { buf[o] = rgb[0]; buf[o + 1] = rgb[1]; buf[o + 2] = rgb[2]; buf[o + 3] = 255; }
        }
      }
    }
    cx += (gl[0] + 1) * scale;
    if (cx >= w) break;
  }
  return cx;
}
module.exports = { drawText, textWidth, charWidth, fitText, CW, CH };
`;
</script>
